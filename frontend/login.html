<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Aqua Pump | Login</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="login.css">

</head>

<body class="login-page">

    <main class="login-container">

        <!-- BRAND -->

        <div class="login-brand">

            <div class="login-logo">
                💧
            </div>

            <h1>Aqua Pump</h1>

            <p>
                Smart Water Management System
            </p>

        </div>


        <!-- LOGIN CARD -->

        <section class="login-card">

            <div class="login-heading">

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Sign in to access your Aqua Pump system
                </p>

            </div>


            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@example.com"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <div class="password-label">

                        <label for="password">
                            Password
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <div class="password-input">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- REMEMBER -->

                <div class="remember-row">

                    <label>

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>

                </div>


                <!-- ERROR -->

                <div
                    id="loginError"
                    class="login-error"
                >
                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-button"
                >

                    Sign In

                </button>

            </form>


            <!-- SECURITY -->

            <div class="security-message">

                <span>🔒</span>

                <p>
                    Your connection is secure.
                    Only authorized administrators
                    can access the system.
                </p>

            </div>

        </section>


        <!-- FOOTER -->

        <footer class="login-footer">

            <span>
                Aqua Pump Smart Water System
            </span>

            <span>
                •
            </span>

            <span>
                v1.0
            </span>

        </footer>

    </main>


    <script src="login.js"></script>

</body>

</html>
