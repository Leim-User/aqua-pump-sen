
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Aqua Pump</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/aq.png">
</head>
<body>
    <main class="login-container">
        <section class="login-card">

            <div class="logo">
                <div class="logo-icon">#</div>
                <h1>Aqua Pump</h1>
                <p>Smart Water System</p>
            </div>

            <div class="login-heading">
                <h2>Welcome Back</h2>
                <p>Sign in to access your dashboard</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                           placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="login-button">
                    Sign In
                </button>

                <div class="form-options">
                    <label class="accountStatus">
                        <span>Don't yet have an account?</span>
                    </label>
                    <a href="register.html" id="register">Register</a>
                </div>


                <p id="loginMessage" class="login-message"></p>
            </form>

            <p class="footer-text">Aqua Pump &copy; 2026</p>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
